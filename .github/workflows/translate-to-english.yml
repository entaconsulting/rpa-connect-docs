name: Translate Spanish Content
on:
  push:
    paths:
      - 'spanish/**'  # Solo se ejecuta cuando hay cambios en la carpeta spanish
  workflow_dispatch:  # Permite ejecutar manualmente

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}  # Usamos el token automático de GitHub
          
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openai pyyaml

      - name: Translate content
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_API_BASE }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT_NAME }}
          AZURE_OPENAI_API_VERSION: ${{ secrets.AZURE_OPENAI_API_VERSION }}
        run: |
          python -c '
          import os
          import glob
          import openai
          from pathlib import Path

          # Configurar Azure OpenAI
          openai.api_key = os.getenv("AZURE_OPENAI_API_KEY")
          openai.api_base = os.getenv("AZURE_OPENAI_ENDPOINT")
          openai.api_type = "azure"
          openai.api_version = os.getenv("AZURE_OPENAI_API_VERSION")

          def translate_text(text):
              try:
                  response = openai.chat.completions.create(
                      model=os.getenv("AZURE_OPENAI_DEPLOYMENT"),
                      messages=[
                          {"role": "system", "content": "You are a translator. Translate the following Spanish text to English, maintaining the original format and structure."},
                          {"role": "user", "content": text}
                      ]
                  )
                  return response.choices[0].message.content
              except Exception as e:
                  print(f"Error translating text: {e}")
                  return None

          # Crear directorio english si no existe
          os.makedirs("english", exist_ok=True)

          # Procesar todos los archivos en la carpeta spanish
          for spanish_file in glob.glob("spanish/**/*.*", recursive=True):
              if os.path.isfile(spanish_file):
                  # Crear la misma estructura de carpetas en english
                  relative_path = os.path.relpath(spanish_file, "spanish")
                  english_file = os.path.join("english", relative_path)
                  os.makedirs(os.path.dirname(english_file), exist_ok=True)

                  # Leer y traducir el contenido
                  with open(spanish_file, "r", encoding="utf-8") as f:
                      content = f.read()
                  
                  translated_content = translate_text(content)
                  
                  if translated_content:
                      # Guardar la traducción
                      with open(english_file, "w", encoding="utf-8") as f:
                          f.write(translated_content)
                      print(f"Translated {spanish_file} -> {english_file}")
          '

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add english/
          git commit -m "Translate Spanish content to English" || echo "No changes to commit"
          git push
